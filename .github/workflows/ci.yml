name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Instalar pytest
        run: python -m pip install --upgrade pip pytest pytest-xdist

      - name: Ejecutar la suite
        run: python -m pytest tests/ -q -n 2

  install:
    name: instalación editable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Instalar el paquete
        run: python -m pip install -e .

      - name: Comprobar toolkit fuera del repositorio
        working-directory: ${{ runner.temp }}
        run: |
          toolkit --help
          python -c "import cli.main, core.plan, state.store, mcp.server"
