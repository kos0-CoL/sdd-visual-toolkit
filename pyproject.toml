[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-toolkit"
version = "0.1.5"
description = "Herramienta visual de Desarrollo Guiado por Especificaciones (SDD): orquesta, asiste y controla el desarrollo con IA sin burocracia."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
toolkit = "cli.main:main"

[tool.setuptools.packages.find]
# Paquetes de espacio de nombres (sin __init__.py en la raíz del repo).
include = ["cli*", "core*", "state*", "mcp*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
