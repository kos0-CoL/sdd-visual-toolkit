[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-toolkit"
version = "0.2.5"
description = "Herramienta visual de Desarrollo Guiado por Especificaciones (SDD): orquesta, asiste y controla el desarrollo con IA sin burocracia."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
toolkit = "cli.main:main"
# Mismo programa con el nombre corto: `sdd init` dentro de la carpeta del
# proyecto, como en spec-kit. Los dos apuntan al mismo `main`.
sdd = "cli.main:main"

[tool.setuptools.packages.find]
# Paquetes de espacio de nombres (sin __init__.py en la raíz del repo).
include = ["cli*", "core*", "state*", "mcp*"]
namespaces = true

[tool.setuptools.data-files]
# El .vsix viaja con el paquete: `sdd init` lo instala sin que el usuario
# tenga que buscarlo ni abrir el Marketplace.
"share/sdd-toolkit" = ["ide/vscode/*.vsix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lento: levanta procesos reales y tarda segundos; se deja fuera con -m 'not lento'",
]
