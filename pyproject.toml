[project]
name = "sdd-toolkit"
version = "0.1.0"
description = "Herramienta visual de Desarrollo Guiado por Especificaciones (SDD): orquesta, asiste y controla el desarrollo con IA sin burocracia."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
toolkit = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
